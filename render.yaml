services:
  - type: web
    name: diago
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaptaa-db
          property: connectionString
      - key: DB_SCHEMA
        value: diago
      - key: ADMIN_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://diago.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
